name: Anansi site and package CI

on:
  pull_request:
  push:
    branches:
      - main
      - consolidate-public-package

jobs:
  site-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check public package boundary
        run: npm run package:check

      - name: Dry-run npm pack
        working-directory: packages/anansi-ai
        run: npm pack --dry-run

      - name: Test package install flow
        working-directory: packages/anansi-ai
        run: |
          rm -rf /tmp/anansi-ci-home
          HOME=/tmp/anansi-ci-home node bin/anansi-ai.js connect --no-open
          HOME=/tmp/anansi-ci-home node bin/anansi-ai.js doctor
